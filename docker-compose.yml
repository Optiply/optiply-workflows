# Full stack: Postgres, a one-shot migration, the API (serves the web app too), two workers, the code executor
# that runs Python code blocks, and the builder that installs workflows' Python packages.
#   docker compose up --build
# Secrets come from .env (see .env.example); DATABASE_URL is wired to the bundled Postgres here.

x-app: &app
  build: .
  image: optiply-workflows:local
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://ow:ow@postgres:5432/optiply_workflows
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS in .env}
    ENCRYPTION_KEY_CURRENT: ${ENCRYPTION_KEY_CURRENT:-}
    OIDC_ISSUER: ${OIDC_ISSUER:-https://accounts.google.com}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    OIDC_ALLOWED_DOMAIN: ${OIDC_ALLOWED_DOMAIN:-optiply.nl}
    LOCAL_LOGIN_ENABLED: ${LOCAL_LOGIN_ENABLED:-false}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # Lets fetch in workflow code reach private addresses (local test servers only).
    CODE_FETCH_ALLOW_PRIVATE_NETWORK: ${CODE_FETCH_ALLOW_PRIVATE_NETWORK:-false}
    RUN_RETENTION_DAYS: ${RUN_RETENTION_DAYS:-30}
    # When set, /metrics (API: PUBLIC port; workers: METRICS_PORT, default 9464) needs this Bearer token.
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    # Git sync (M11): workers check the deploy branch this often (seconds; 0: webhook and Deploy now only).
    GIT_POLL_SECONDS: ${GIT_POLL_SECONDS:-60}
    # Deploy problems are re-checked this often (minutes; 0: only when the instance changes; M22).
    GIT_RETRY_MINUTES: ${GIT_RETRY_MINUTES:-10}
    # Local test repos and a fake GitHub only (file:// and http:// repos; another GitHub API). Keep unset.
    GIT_ALLOW_INSECURE_URLS: ${GIT_ALLOW_INSECURE_URLS:-false}
    GITHUB_API_URL: ${GITHUB_API_URL:-}
    # Python code blocks (M12): the code-executor service below, on its own network.
    # Without a token Python stays off (a warning at start): the app runs, Python blocks can't.
    PYTHON_EXECUTOR_URL: http://code-executor:8080
    PYTHON_EXECUTOR_TOKEN: ${PYTHON_EXECUTOR_TOKEN:-}
    # SDK resources (M37): their calls run in the sdk-runner; without a token SDK resources can't run.
    SDK_RUNNER_URL: http://sdk-runner:8080
    SDK_RUNNER_TOKEN: ${SDK_RUNNER_TOKEN:-}
    # JDBC resources (M38): their queries run in the jdbc-runner; without a token JDBC resources can't run.
    JDBC_RUNNER_URL: http://jdbc-runner:8080
    JDBC_RUNNER_TOKEN: ${JDBC_RUNNER_TOKEN:-}
    # JDBC resources through SSH: the runner connects back to this port of the process that holds the tunnel (on the
    # executor network, by its container's host name), opening each connection with that tunnel's secret.
    JDBC_FORWARDER_PORT: ${JDBC_FORWARDER_PORT:-7070}
    # Workflows' Python packages (M23): the python-builder service below. Without its token, workflows that declare
    # packages can't run or be published.
    PYTHON_BUILDER_URL: http://python-builder:8080
    PYTHON_BUILDER_TOKEN: ${PYTHON_BUILDER_TOKEN:-}
    # Google Cloud IAP for SSH tunnels (M18): `allow` lets admins pick the server's own Google identity.
    GOOGLE_SERVER_IDENTITY: ${GOOGLE_SERVER_IDENTITY:-}
    # The built-in REST API resource (M27) reaches public addresses only; these private hosts too (comma-separated).
    REST_API_PRIVATE_HOSTS: ${REST_API_PRIVATE_HOSTS:-}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ow
      POSTGRES_PASSWORD: ow
      POSTGRES_DB: optiply_workflows
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ow -d optiply_workflows"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *app-env
      ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      ROLE: api
    ports:
      - "3000:3000"
    networks: [default, executor]
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Optional: the app starts without it (Python blocks then fail until it's up).
      code-executor:
        condition: service_started
        required: false

  worker:
    <<: *app
    environment:
      <<: *app-env
      ROLE: worker
    deploy:
      replicas: 2
    networks: [default, executor]
    depends_on:
      migrate:
        condition: service_completed_successfully
      code-executor:
        condition: service_started
        required: false

  # Runs Python code blocks, each in a fresh nsjail jail (docs/architecture.md §2.14, §2.26, docs/runbooks/python.md);
  # PYTHON_WARM_JAILS of them are started ahead, numpy and pandas imported, each used for one run.
  # The only service with extra privileges: SYS_ADMIN for nsjail's namespaces, Docker's seccomp profile plus
  # pivot_root, and AppArmor off (Docker's profile refuses nsjail's mounts; the jail has its own seccomp policy).
  # It holds no secrets but its token, has no published port, and sits on an internal network with the app only:
  # no database, no internet.
  code-executor:
    build: apps/code-executor
    image: optiply-workflows-code-executor:local
    restart: unless-stopped
    environment:
      # Without one it refuses to start (and Python stays off in the app).
      PYTHON_EXECUTOR_TOKEN: ${PYTHON_EXECUTOR_TOKEN:-}
      PYTHON_MEMORY_MB: ${PYTHON_MEMORY_MB:-256}
      PYTHON_MAX_CONCURRENT: ${PYTHON_MAX_CONCURRENT:-4}
      PYTHON_WARM_JAILS: ${PYTHON_WARM_JAILS:-4}
      PYTHON_PREIMPORT: ${PYTHON_PREIMPORT-numpy,pandas}  # set it empty for none
      # A warm jail per workflow env (M32): for this many envs at most, dropped when not run for the idle time.
      PYTHON_WARM_ENV_JAILS: ${PYTHON_WARM_ENV_JAILS:-4}
      PYTHON_WARM_ENV_IDLE_SECONDS: ${PYTHON_WARM_ENV_IDLE_SECONDS:-600}
      PYTHON_WARM_ENV_MAX_MB: ${PYTHON_WARM_ENV_MAX_MB:-256}  # an env's warm jail holding more isn't kept
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp=./apps/code-executor/seccomp.json
      - apparmor=unconfined
    # The jails' memory counts here too: PYTHON_MAX_CONCURRENT x PYTHON_MEMORY_MB, plus ~45 MB per warm jail (numpy
    # and pandas imported; an env's warm jail its packages too) and the server.
    mem_limit: 2g
    pids_limit: 512
    networks: [executor]
    # Workflows' packages, as the builder installed them; the jail mounts one read-only per run that needs it.
    volumes:
      - python-envs:/envs:ro
    depends_on:
      # It first sets up the envs volume (owned by its user); the executor only reads it.
      python-builder:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Installs workflows' Python packages (M23, docs/architecture.md §2.26, docs/runbooks/python.md): pip into envs on
  # the python-envs volume. The only Python service with internet access (the package indexes); no secrets but its
  # token (an index's password comes with each request that needs it), no database. Wheels install without running
  # package code; an sdist (M32, §2.35) is built in nsjail, offline: hence the executor's capability and profile.
  python-builder:
    build:
      context: apps/code-executor
      target: builder
    image: optiply-workflows-python-builder:local
    restart: unless-stopped
    environment:
      # Without one it refuses to start (and packages stay off in the app).
      PYTHON_BUILDER_TOKEN: ${PYTHON_BUILDER_TOKEN:-}
      PYTHON_PACKAGE_INDEX_URL: ${PYTHON_PACKAGE_INDEX_URL:-https://pypi.org/simple}
      PYTHON_ENV_MAX_MB: ${PYTHON_ENV_MAX_MB:-1024}
      PYTHON_ENV_KEEP_DAYS: ${PYTHON_ENV_KEEP_DAYS:-30}
      # sdists' builds (M32): address space and time per build, how many per set of requirements.
      PYTHON_SDIST_MEMORY_MB: ${PYTHON_SDIST_MEMORY_MB:-2048}
      PYTHON_SDIST_TIMEOUT_SECONDS: ${PYTHON_SDIST_TIMEOUT_SECONDS:-300}
      PYTHON_MAX_SDISTS: ${PYTHON_MAX_SDISTS:-10}
      # Admin-defined indexes over http (a local mirror): off.
      PYTHON_ALLOW_INSECURE_INDEXES: ${PYTHON_ALLOW_INSECURE_INDEXES:-}
    volumes:
      - python-envs:/envs
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp=./apps/code-executor/seccomp.json
      - apparmor=unconfined
    # Two builds at once, a compiler's among them.
    mem_limit: 2g
    pids_limit: 512
    networks: [executor, builder-egress]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Calls company SDKs (M37, docs/architecture.md §2.41, docs/runbooks/sdk.md): each call in a fresh nsjail jail
  # (Python or Node), its network only through a proxy of its own that lets the resource's hosts through. The
  # executor's privileges and profile (nsjail); its token and nothing else (a call's OAuth token and secrets come
  # with the call and go to the jail on stdin). It reaches the internet through sdk-egress, the jails never directly.
  sdk-runner:
    build:
      context: apps/code-executor
      target: sdk-runner
    image: optiply-workflows-sdk-runner:local
    restart: unless-stopped
    environment:
      # Without one it refuses to start (and SDK resources can't run).
      SDK_RUNNER_TOKEN: ${SDK_RUNNER_TOKEN:-}
      SDK_MEMORY_MB: ${SDK_MEMORY_MB:-512}
      SDK_MAX_CONCURRENT: ${SDK_MAX_CONCURRENT:-4}
    cap_add: [SYS_ADMIN]
    security_opt:
      - seccomp=./apps/code-executor/seccomp.json
      - apparmor=unconfined
    mem_limit: 3g
    pids_limit: 512
    networks: [executor, sdk-egress]
    # The SDKs' installed packages (the builder's), mounted read-only into each jail that needs them.
    volumes:
      - python-envs:/envs:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  # Runs JDBC resources' queries (M38, docs/architecture.md §2.42, docs/runbooks/jdbc.md): Java, with Oracle,
  # Snowflake and ClickHouse drivers built in and admins' uploaded jars (kept in jdbc-drivers). Its token and nothing
  # else: each query brings its connection's settings and secrets. Read-only, /tmp in memory (wallets, drivers'
  # caches); it reaches databases through jdbc-egress, and nothing of the app's but through the executor network.
  jdbc-runner:
    build: apps/jdbc-runner
    image: optiply-workflows-jdbc-runner:local
    restart: unless-stopped
    environment:
      # Without one it refuses to start (and JDBC resources can't run).
      JDBC_RUNNER_TOKEN: ${JDBC_RUNNER_TOKEN:-}
      JDBC_MAX_CONCURRENT: ${JDBC_MAX_CONCURRENT:-32}
      JDBC_MAX_POOLS: ${JDBC_MAX_POOLS:-50}
    read_only: true
    tmpfs:
      - /tmp:size=256m
    mem_limit: 2g
    networks: [executor, jdbc-egress]
    volumes:
      - jdbc-drivers:/drivers
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q ok <&3"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

networks:
  # The app, the code executor, the builder and the SDK and JDBC runners; internal: the executor reaches nothing
  # outside it.
  executor:
    internal: true
  # The builder's way out to the package index.
  builder-egress: {}
  # The SDK runner's proxy's way out to the SDKs' APIs (M37).
  sdk-egress: {}
  # The JDBC runner's way out to the databases (M38).
  jdbc-egress: {}

volumes:
  pgdata:
  python-envs:
  jdbc-drivers:
