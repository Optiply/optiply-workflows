# Full stack: Postgres, a one-shot migration, the API (serves the web app too) and two workers.
#   docker compose up --build
# Secrets come from .env (see .env.example); DATABASE_URL is wired to the bundled Postgres here.

x-app: &app
  build: .
  image: optiply-workflows:local
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://ow:ow@postgres:5432/optiply_workflows
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
    ENCRYPTION_KEYS: ${ENCRYPTION_KEYS:?set ENCRYPTION_KEYS in .env}
    ENCRYPTION_KEY_CURRENT: ${ENCRYPTION_KEY_CURRENT:-}
    OIDC_ISSUER: ${OIDC_ISSUER:-https://accounts.google.com}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    OIDC_ALLOWED_DOMAIN: ${OIDC_ALLOWED_DOMAIN:-optiply.nl}
    LOCAL_LOGIN_ENABLED: ${LOCAL_LOGIN_ENABLED:-false}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    # Lets fetch in workflow code reach private addresses (local test servers only).
    CODE_FETCH_ALLOW_PRIVATE_NETWORK: ${CODE_FETCH_ALLOW_PRIVATE_NETWORK:-false}
    RUN_RETENTION_DAYS: ${RUN_RETENTION_DAYS:-30}
    # When set, /metrics (API: PUBLIC port; workers: METRICS_PORT, default 9464) needs this Bearer token.
    METRICS_TOKEN: ${METRICS_TOKEN:-}

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ow
      POSTGRES_PASSWORD: ow
      POSTGRES_DB: optiply_workflows
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ow -d optiply_workflows"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    restart: "no"
    environment:
      <<: *app-env
      ROLE: migrate
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    environment:
      <<: *app-env
      ROLE: api
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    environment:
      <<: *app-env
      ROLE: worker
    deploy:
      replicas: 2
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
