# Deploys main to production (docs/runbooks/deploy.md) once a day, weekdays at 18:00 Amsterdam time: the latest commit
# on main that passed CI, unless production already runs it. Merging doesn't deploy. By hand ("Run workflow") any time:
# main's head, or an already-built tag (e.g. to roll back). Builds the images on Cloud Build, copies deploy/ to the VM, runs deploy.sh (migrations included), checks health and rolls
# back to the previous version when the app doesn't come up.
# GitHub signs in to Google Cloud without a stored key (Workload Identity Federation): the provider trusts only this
# repository's main branch, as the service account gh-deployer (Cloud Builds, SSH to ow-prod through IAP).
name: Deploy

on:
  schedule:
    # Cron runs in UTC: 16:00 UTC is 18:00 in Amsterdam in summer time, 17:00 UTC in winter time. Both fire; the
    # "Pick the commit" step lets only the one that is 18:00 in Amsterdam go on. GitHub may start them some minutes late.
    - cron: '0 16 * * 1-5'
    - cron: '0 17 * * 1-5'
  workflow_dispatch:
    inputs:
      tag:
        description: "Deploy this already-built image tag (a short commit hash, e.g. to roll back) instead of building main"
        required: false
        default: ""

# One deploy at a time; a newer one waits for the running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read # gh run list: which commits passed CI
  contents: read
  id-token: write

env:
  PROJECT: optiply-workflows
  REGION: us-east1
  ZONE: us-east1-b
  VM: ow-prod
  SITE: https://104-196-197-26.sslip.io

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Pick the commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != schedule ]; then
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          offset=$(TZ=Europe/Amsterdam date +%z)
          case "$SCHEDULE $offset" in
            "0 16 * * 1-5 +0200" | "0 17 * * 1-5 +0100") ;;
            *) echo "Not 18:00 in Amsterdam (UTC offset there: $offset): the other schedule deploys"
               echo "go=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          # The latest push to main whose CI passed. Docs-only merges run no CI, so they are never picked.
          sha=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success \
            --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$sha" ]; then
            echo "::warning::No commit on main has passed CI: nothing to deploy"
            echo "go=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "The latest commit on main that passed CI: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.pick.outputs.go == 'true'
        with:
          ref: ${{ steps.pick.outputs.sha }}

      - uses: google-github-actions/auth@v2
        if: steps.pick.outputs.go == 'true'
        with:
          workload_identity_provider: projects/961583540192/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: gh-deployer@optiply-workflows.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.pick.outputs.go == 'true'

      - name: Choose the version
        id: version
        if: steps.pick.outputs.go == 'true'
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            # Only a tag's characters: it ends up in a command on the VM.
            [[ "$INPUT_TAG" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || { echo "::error::Not a valid image tag: $INPUT_TAG"; exit 1; }
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag=$(git rev-parse --short=7 HEAD)
          if [ "$EVENT" = schedule ]; then
            # The daily run deploys only something new; by hand always deploys (e.g. to redo a failed deploy).
            # Behind a marker: the runner's first gcloud compute ssh prints its new key's text on stdout too (it did,
            # 2026-11-19), which made "already runs it" never match.
            current=$(gcloud compute ssh "$VM" --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --quiet \
              --command 'echo "current-tag=$(sudo cat /opt/ow/.current-tag)"' | sed -n 's/^current-tag=//p' | tail -n 1 \
              | tr -d '[:space:]')
            if [ "$current" = "$tag" ]; then
              echo "Production already runs $tag: nothing to deploy"
              echo "build=false" >> "$GITHUB_OUTPUT"
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Production runs ${current:-?}; deploying $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - name: Build the images (Cloud Build)
        if: steps.version.outputs.build == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # --async + polling: streaming the build's log would need a log-reading role. The staging folder is named:
          # with Cloud Build's default one, gcloud first lists every bucket in the project (an ownership check),
          # which gh-deployer may not; it has rights on this bucket only.
          id=$(gcloud builds submit --project "$PROJECT" --region "$REGION" --config deploy/cloudbuild.yaml \
            --gcs-source-staging-dir "gs://optiply-workflows_cloudbuild/source" \
            --substitutions "_TAG=$TAG" --async --format='value(id)' .)
          echo "Build $id: https://console.cloud.google.com/cloud-build/builds;region=$REGION/$id?project=$PROJECT"
          for _ in $(seq 1 120); do
            status=$(gcloud builds describe "$id" --project "$PROJECT" --region "$REGION" --format='value(status)')
            case "$status" in
              SUCCESS) echo "Built $TAG"; exit 0 ;;
              FAILURE|INTERNAL_ERROR|TIMEOUT|CANCELLED|EXPIRED) echo "::error::Build $status"; exit 1 ;;
            esac
            sleep 20
          done
          echo "::error::The build took longer than 40 minutes"; exit 1

      - name: Copy deploy/ to the VM
        if: steps.version.outputs.deploy == 'true'
        run: |
          mkdir -p /tmp/ow && cp deploy/* apps/code-executor/seccomp.json /tmp/ow/
          gcloud compute ssh "$VM" --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --quiet \
            --command 'rm -rf /tmp/ow-deploy && mkdir -p /tmp/ow-deploy'
          gcloud compute scp /tmp/ow/* "$VM":/tmp/ow-deploy/ --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --quiet
          gcloud compute ssh "$VM" --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --quiet \
            --command 'sudo cp /tmp/ow-deploy/* /opt/ow/ && sudo chmod +x /opt/ow/*.sh && rm -rf /tmp/ow-deploy'

      - name: Deploy
        id: deploy
        if: steps.version.outputs.deploy == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          UNIT: ow-deploy-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # deploy.sh runs on the VM as its own systemd unit, so a dropped SSH connection can't cut it off (one did on
          # 2026-11-20: the 1 GB VM deep in swap while pulling). Short SSH calls follow it; one that fails is retried.
          vm() {
            gcloud compute ssh "$VM" --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --quiet --command "$1"
          }
          vm "sudo systemd-run --unit=$UNIT --remain-after-exit --property=StandardOutput=append:/var/log/$UNIT.log \
            --property=StandardError=append:/var/log/$UNIT.log /opt/ow/deploy.sh $TAG"
          echo "Started $UNIT on $VM (its log: /var/log/$UNIT.log)"
          deadline=$((SECONDS + 1500))
          state=""
          while [ "$state" != exited ] && [ "$state" != failed ]; do
            if [ "$SECONDS" -gt "$deadline" ]; then
              # Stopped before failing: the rollback that follows mustn't run alongside it.
              vm "sudo systemctl stop $UNIT" || true
              echo "::error::deploy.sh still running after 25 minutes: stopped"
              exit 1
            fi
            sleep 15
            # Behind a marker: the runner's first SSH call may print its new key's text too.
            state=$(vm "echo \"unit-state=\$(systemctl show -p SubState --value $UNIT)\"" 2>/dev/null \
              | sed -n 's/^unit-state=//p' | tail -n 1) || state=""
          done
          # The unit's log and result: a read-only call, tried again when SSH refuses it (on 2026-11-20 this call got
          # "Permission denied (publickey)" once, the VM low on memory, and failed a deploy that had worked). Stopping
          # and resetting the unit is a separate call: a reset clears a failed result, so it mustn't come before a
          # successful read.
          result=""
          for attempt in 1 2 3 4 5; do
            if result=$(vm "sudo cat /var/log/$UNIT.log; echo \"unit-result=\$(systemctl show -p Result --value $UNIT)\""); then
              printf '%s\n' "$result" | grep -q '^unit-result=' && break
            fi
            result=""
            echo "Reading deploy.sh's result over SSH failed (attempt $attempt of 5)"
            [ "$attempt" = 5 ] || sleep 15
          done
          # Best effort: a unit left behind only keeps its name, which is unique to this run and attempt.
          vm "sudo systemctl stop $UNIT; sudo systemctl reset-failed $UNIT 2>/dev/null || true" || true
          if [ -z "$result" ]; then
            echo "::error::Couldn't read deploy.sh's result over SSH (5 tries); its log: /var/log/$UNIT.log on $VM"
            exit 1
          fi
          printf '%s\n' "$result" | grep -v '^unit-result='
          [ "$(printf '%s\n' "$result" | sed -n 's/^unit-result=//p' | tail -n 1)" = success ] || {
            echo "::error::deploy.sh failed (its log above)"
            exit 1
          }

      - name: Check health, roll back if it fails
        # Also after a failed deploy step: whatever it left half done is checked, and rolled back when unhealthy.
        if: always() && steps.deploy.outcome != 'skipped'
        run: |
          for _ in $(seq 1 36); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$SITE/api/health")" = 200 ]; then
              echo "Healthy: $SITE"; exit 0
            fi
            sleep 5
          done
          echo "::error::$SITE/api/health didn't answer 200 within 3 minutes: rolling back"
          gcloud compute ssh "$VM" --zone "$ZONE" --project "$PROJECT" --tunnel-through-iap --quiet \
            --command 'sudo /opt/ow/deploy.sh $(cat /opt/ow/.previous-tag)'
          exit 1
