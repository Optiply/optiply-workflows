name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Ubuntu 24.04 (ubuntu-latest) lets unprivileged user namespaces make no mounts (AppArmor); the package
      # builder's sdist jail runs as its own user in one (M32). See docs/runbooks/python.md.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome ci .
      - run: pnpm typecheck
      # Tests boot an embedded Postgres (embedded-postgres npm binaries); no service container needed.
      # Every package's tests run even when one fails, so one run shows every failure (turbo stops all by default).
      - run: pnpm test --continue=dependencies-successful
      # M4's done-when (sync webhook p50 under 50 ms), measured alone: during `pnpm test` every package's suite and
      # its Postgres compete for the runner's CPUs.
      - run: pnpm --filter @ow/server bench:webhooks
      # M0's isolate target (a fresh context in under 10 ms), also measured alone.
      - run: pnpm --filter @ow/sandbox bench

  # Playwright against the bundled server serving the built web app (see apps/web/e2e/global-setup.ts).
  e2e:
    runs-on: ubuntu-latest
    # One worker, 176 specs by M36: ~40 min on the runner, plus the build and Playwright's install here.
    timeout-minutes: 90
    steps:
      # Ubuntu 24.04 (ubuntu-latest) lets unprivileged user namespaces make no mounts (AppArmor); the package
      # builder's sdist jail runs as its own user in one (M32). See docs/runbooks/python.md.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ow/web build && pnpm --filter @ow/server build
      - run: pnpm --filter @ow/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ow/web e2e
      - uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t optiply-workflows:ci .
      - run: docker build -t optiply-workflows-code-executor:ci apps/code-executor
      - run: docker build --target builder -t optiply-workflows-python-builder:ci apps/code-executor
      - run: docker build --target sdk-runner -t optiply-workflows-sdk-runner:ci apps/code-executor
      - run: docker build -t optiply-workflows-jdbc-runner:ci apps/jdbc-runner
