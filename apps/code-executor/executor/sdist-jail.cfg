# The jail for building one sdist's wheel (M32, docs/architecture.md §2.35), in the package builder: no network, no
# token, not the envs volume; the sdist and its build requirements read-only, /out the only thing written. nsjail runs
# as the builder's own user (no cgroups: limits are rlimits, and the container's memory limit). The builder adds
# --time_limit, --rlimit_cpu, --rlimit_as and the three bind mounts (/src, /wheelhouse, /out).
name: "sdist"
mode: ONCE
hostname: "build"
cwd: "/tmp"
time_limit: 300

keep_env: false
envar: "TZ=UTC"
envar: "HOME=/tmp"
envar: "LANG=C.UTF-8"
envar: "PATH=/usr/local/bin:/usr/bin:/bin"
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "PIP_NO_CACHE_DIR=1"
envar: "PIP_DISABLE_PIP_VERSION_CHECK=1"
envar: "PIP_NO_INPUT=1"
envar: "SOURCE_DATE_EPOCH=315532800"

# Every namespace; no network at all (only a loopback, down). The builder's user is the only one it may map.
clone_newnet: true
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true

rlimit_as: 2048              # MB (the builder sets PYTHON_SDIST_MEMORY_MB)
rlimit_core: 0
rlimit_cpu: 300
rlimit_fsize: 1024           # MB
rlimit_nofile: 1024
rlimit_nproc: 256            # counted in the jail's own user namespace
rlimit_stack: 8

# The image's Python, pip and compilers read-only; /tmp a tmpfs; nothing else.
mount { src: "/usr" dst: "/usr" is_bind: true rw: false }
mount { src: "/etc/ld.so.cache" dst: "/etc/ld.so.cache" is_bind: true rw: false }
mount { src: "/etc/alternatives" dst: "/etc/alternatives" is_bind: true rw: false mandatory: false }
mount { src: "/usr/lib" dst: "/lib" is_symlink: true }
mount { src: "/usr/bin" dst: "/bin" is_symlink: true }
mount { src: "/usr/lib64" dst: "/lib64" is_symlink: true }
mount { dst: "/tmp" fstype: "tmpfs" rw: true options: "size=1073741824,mode=1777" }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/zero" dst: "/dev/zero" is_bind: true rw: false }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true rw: false }

# As the executor's jail: nothing that inspects other processes, mounts, loads kernel code, or makes namespaces.
seccomp_string: "ERRNO(1) {"
seccomp_string: "  ptrace, process_vm_readv, process_vm_writev, kcmp, pidfd_getfd,"
seccomp_string: "  mount, umount, pivot_root, chroot, move_mount, open_tree, fsopen, fsmount, fspick, mount_setattr,"
seccomp_string: "  unshare, setns, keyctl, add_key, request_key, bpf, perf_event_open, userfaultfd,"
seccomp_string: "  init_module, finit_module, delete_module, kexec_load, kexec_file_load,"
seccomp_string: "  swapon, swapoff, reboot, acct, quotactl, syslog, open_by_handle_at, name_to_handle_at,"
seccomp_string: "  io_uring_setup, io_uring_enter, io_uring_register,"
seccomp_string: "  clone { (clone_flags & 0x7e020000) != 0 }"
seccomp_string: "}"
seccomp_string: "ERRNO(38) { clone3 }"
seccomp_string: "DEFAULT ALLOW"

exec_bin { path: "/usr/local/bin/python3" arg: "-I" arg: "-m" arg: "pip" }
