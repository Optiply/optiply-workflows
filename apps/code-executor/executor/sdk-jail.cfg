# The jail for one SDK call (M37, docs/architecture.md §2.41; nsjail's config.proto, text format): jail.cfg's, with a
# loopback for the proxy forwarder, more memory and tasks (Node's threads), the CA certificates, and the program
# (Python's or Node's runner) given by sdk_server.py. It adds the per-run limits and mounts: --time_limit,
# --rlimit_cpu, --cgroup_mem_max, --pass_fd (the result pipe), --log_fd, the env, the proxy's socket.
name: "sdk"
mode: ONCE
hostname: "jail"
cwd: "/tmp"
time_limit: 10
max_cpus: 1

keep_env: false
envar: "TZ=UTC"
envar: "HOME=/tmp"
envar: "LANG=C.UTF-8"
envar: "PYTHONDONTWRITEBYTECODE=1"
envar: "PYTHONHASHSEED=0"
envar: "PYTHONUNBUFFERED=1"
# Every HTTP client that honours the usual proxy variables goes through the forwarder (Node 24: with NODE_USE_ENV_PROXY).
envar: "HTTPS_PROXY=http://127.0.0.1:3128"
envar: "HTTP_PROXY=http://127.0.0.1:3128"
envar: "https_proxy=http://127.0.0.1:3128"
envar: "http_proxy=http://127.0.0.1:3128"
envar: "NODE_USE_ENV_PROXY=1"
envar: "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt"
envar: "REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt"
envar: "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt"

# Every namespace. Its own network namespace with nothing but a loopback (up): the runner's forwarder listens there
# and hands each connection to the proxy's Unix socket outside, which lets only the resource's hosts through.
clone_newnet: true
iface_no_lo: false
clone_newuser: true
clone_newns: true
clone_newpid: true
clone_newipc: true
clone_newuts: true
clone_newcgroup: true
# nobody inside, and nobody outside too (not the executor's root).
uidmap { inside_id: "65534" outside_id: "65534" count: 1 }
gidmap { inside_id: "65534" outside_id: "65534" count: 1 }

rlimit_as_type: INF          # memory is the cgroup's job (numpy reserves large address ranges)
rlimit_core: 0
rlimit_cpu: 10
rlimit_fsize: 16             # MB
rlimit_nofile: 256
rlimit_nproc_type: INF       # PIDs are the cgroup's job
rlimit_stack: 8

# cgroup v2 (the entrypoint delegates the controllers): memory without swap, 32 tasks, one CPU.
use_cgroupv2: true
cgroupv2_mount: "/sys/fs/cgroup"
cgroup_mem_max: 536870912
cgroup_mem_swap_max: 0
# Node starts a dozen threads; an SDK may start a few more.
cgroup_pids_max: 64
cgroup_cpu_ms_per_sec: 1000

# Python and its packages read-only; /tmp a small tmpfs (charged to the memory cgroup); nothing else.
mount { src: "/usr" dst: "/usr" is_bind: true rw: false }
mount { src: "/opt/py" dst: "/opt/py" is_bind: true rw: false }
mount { src: "/opt/executor/runner.py" dst: "/opt/runner/runner.py" is_bind: true rw: false }
mount { src: "/opt/executor/runner_sdk.py" dst: "/opt/runner/runner_sdk.py" is_bind: true rw: false }
mount { src: "/opt/executor/runner_sdk.mjs" dst: "/opt/runner/runner_sdk.mjs" is_bind: true rw: false }
mount { src: "/etc/ssl/certs" dst: "/etc/ssl/certs" is_bind: true rw: false }
mount { src: "/etc/ld.so.cache" dst: "/etc/ld.so.cache" is_bind: true rw: false }
mount { src: "/usr/lib" dst: "/lib" is_symlink: true }
mount { src: "/usr/bin" dst: "/bin" is_symlink: true }
# x86-64 binaries name their loader /lib64/ld-linux-x86-64.so.2 (dangling on arm64, which uses /lib).
mount { src: "/usr/lib64" dst: "/lib64" is_symlink: true }
mount { dst: "/tmp" fstype: "tmpfs" rw: true options: "size=134217728,mode=1777" }
mount { src: "/dev/null" dst: "/dev/null" is_bind: true rw: true }
mount { src: "/dev/urandom" dst: "/dev/urandom" is_bind: true rw: false }
# No /proc (a new procfs can't be mounted under Docker's masked /proc without more privileges) and no /sys.

# On top of the container's seccomp profile: nothing that inspects other processes, mounts, loads kernel code, or
# makes namespaces. clone3 says "not implemented", so libc falls back to clone, whose flags can be checked.
seccomp_string: "ERRNO(1) {"
seccomp_string: "  ptrace, process_vm_readv, process_vm_writev, kcmp, pidfd_getfd,"
seccomp_string: "  mount, umount, pivot_root, chroot, move_mount, open_tree, fsopen, fsmount, fspick, mount_setattr,"
seccomp_string: "  unshare, setns, keyctl, add_key, request_key, bpf, perf_event_open, userfaultfd,"
seccomp_string: "  init_module, finit_module, delete_module, kexec_load, kexec_file_load,"
seccomp_string: "  swapon, swapoff, reboot, acct, quotactl, syslog, open_by_handle_at, name_to_handle_at,"
seccomp_string: "  io_uring_setup, io_uring_enter, io_uring_register,"
seccomp_string: "  clone { (clone_flags & 0x7e020000) != 0 }"
seccomp_string: "}"
seccomp_string: "ERRNO(38) { clone3 }"
seccomp_string: "DEFAULT ALLOW"

# The program comes after `--` on nsjail's command line (sdk_server.py: Python's runner or Node's).
